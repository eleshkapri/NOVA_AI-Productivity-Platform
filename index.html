<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF5500' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NOVA is an AI-powered productivity platform that helps high-velocity engineering and product teams manage projects, automate repetitive tasks, and collaborate seamlessly." />
    <meta name="keywords" content="AI productivity, sprint automation, project management, developer tools, agile workflow" />
    <meta name="author" content="NOVA AI Platform" />
    <title>NOVA — Autonomous AI Productivity Platform | Build Better. Work Smarter.</title>
    <link rel="canonical" href="https://nova-ai-platform.web.app" />

    <!-- Dual Theme Color for Browsers & Mobile OS -->
    <meta name="theme-color" content="#05060A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />

    <!-- Apple iOS Web App Experience -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA AI" />

    <!-- Open Graph Protocol (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NOVA — Autonomous AI Productivity Platform" />
    <meta property="og:description" content="Next-generation autonomous engineering platform. Automates sprint planning, conducts AST code reviews, and prevents developer burnout." />
    <meta property="og:url" content="https://nova-ai-platform.web.app" />
    <meta property="og:site_name" content="NOVA AI Productivity Platform" />
    <meta property="og:image" content="https://nova-ai-platform.web.app/og-image.png" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA — Autonomous AI Productivity Platform" />
    <meta name="twitter:description" content="Next-generation autonomous engineering platform. Automates sprint planning, conducts AST code reviews, and prevents developer burnout." />
    <meta name="twitter:image" content="https://nova-ai-platform.web.app/og-image.png" />

    <!-- Security Policies & Meta Protection -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Synchronous Theme Initialization to Prevent FOUC -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('nova_theme');
          var theme = raw ? JSON.parse(raw) : null;
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
